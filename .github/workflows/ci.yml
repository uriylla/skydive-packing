name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: packing
          POSTGRES_PASSWORD: packing
          POSTGRES_DB: packing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://packing:packing@localhost:5432/packing
      DATABASE_URL_TEST: postgres://packing:packing@localhost:5432/packing_test
      DATABASE_URL_E2E: postgres://packing:packing@localhost:5432/packing_e2e
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_TIMEZONE: Europe/Madrid

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create test databases
        env:
          PGPASSWORD: packing
        run: |
          psql -h localhost -U packing -d packing -c "CREATE DATABASE packing_test"
          psql -h localhost -U packing -d packing -c "CREATE DATABASE packing_e2e"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Migrations apply cleanly
        run: pnpm db:migrate

      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
