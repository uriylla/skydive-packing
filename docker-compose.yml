# Local Postgres for development. Production uses a hosted Postgres (e.g. Neon).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: packing
      POSTGRES_PASSWORD: packing
      POSTGRES_DB: packing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
